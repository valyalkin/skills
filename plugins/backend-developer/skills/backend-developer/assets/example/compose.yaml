# Started automatically by `./gradlew bootRun` via spring-boot-docker-compose.
#
# Two deliberate choices keep this from colliding with any other service on the machine:
#   * `name:` scopes the compose project, so containers are invoices-local-* and never clash
#     with another project's "postgres" container.
#   * the port is published WITHOUT a host port, so Docker assigns a free one. Spring Boot's
#     docker-compose support reads the mapped port and configures the datasource from it, so
#     nothing needs to know the number. Never hardcode 5432 here - that is the one line that
#     makes two services unable to run side by side.
name: invoices-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: local-only-not-a-secret
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U invoices -d invoices" ]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Local data is disposable: this keeps restarts fast and leaves no volume behind.
      #
      # The mount is /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18 moved its data
      # directory into a subdirectory of the former, and the image refuses to start if it finds a
      # mount at the old path ("there appears to be PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)").
      - /var/lib/postgresql
